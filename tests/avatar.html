<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semesta City — Avatar Lineup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Orbitron:wght@600;800;900&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1122; font-family: 'M PLUS Rounded 1c', sans-serif; }
    canvas { display: block; }
    #bar { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 70vw; z-index: 5; }
    #bar button, #bar select { font: 700 12px 'M PLUS Rounded 1c', sans-serif; color: #e8e3d5; background: rgba(12,20,40,.75); border: 1px solid rgba(94,231,255,.35); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    #bar button.on { background: rgba(94,231,255,.25); border-color: #5ee7ff; }
    #info { position: fixed; right: 12px; bottom: 12px; color: #9fb3d1; font: 12px monospace; background: rgba(0,0,0,.4); padding: 6px 8px; border-radius: 6px; white-space: pre; z-index: 5; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="bar"></div>
  <div id="info"></div>
  <script type="module" src="./avatar-test.js"></script>
</body>
</html>
